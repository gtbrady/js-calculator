<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <div class="main-container">
        <div class="output">0</div>
        <div class="main-button-container">
            <div class="button-container">
                <button class="number-button">7</button>
                <button class="number-button">4</button>
                <button class="number-button">1</button>
                <button class="other-button">+/-</button>
            </div>
            <div class="button-container">
                <button class="number-button">8</button>
                <button class="number-button">5</button>
                <button class="number-button">2</button>
                <button class="number-button">0</button>
            </div>
            <div class="button-container">
                <button class="number-button">9</button>
                <button class="number-button">6</button>
                <button class="number-button">3</button>
                <button class="other-button">.</button>
            </div>
            <div class="button-container">
                <button class="other-button">&divide;</button>
                <button class="other-button">x</button>
                <button class="other-button">-</button>
                <button class="other-button">+</button>
            </div>
            <div class="button-container">
                <button class="clear-button">C</button>
                <button class="other-button">&larr;</button>
                <button class="equal-button">=</button>
            </div>
        </div>
    </div>
</body>
</html>
