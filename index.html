<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
</head>
<body>
    <div class="main-container">
        <div class="output">0</div>
        <div class="main-button-container">
            <div class="button-container">
                <button class="number-button" id="btn-7">7</button>
                <button class="number-button" id="btn-4">4</button>
                <button class="number-button" id="btn-1">1</button>
                <button class="other-button" id="btn-negation">+/-</button>
            </div>
            <div class="button-container">
                <button class="number-button" id="btn-8">8</button>
                <button class="number-button" id="btn-5">5</button>
                <button class="number-button" id="btn-2">2</button>
                <button class="number-button" id="btn-0">0</button>
            </div>
            <div class="button-container">
                <button class="number-button" id="btn-9">9</button>
                <button class="number-button" id="btn-6">6</button>
                <button class="number-button" id="btn-3">3</button>
                <button class="other-button" id="btn-decimal">.</button>
            </div>
            <div class="button-container">
                <button class="other-button" id="btn-divide">&divide;</button>
                <button class="other-button" id="btn-multiply">x</button>
                <button class="other-button" id="btn-subtract">-</button>
                <button class="other-button" id="btn-add">+</button>
            </div>
            <div class="button-container">
                <button class="clear-button">C</button>
                <button class="other-button" id="btn-backspace">&larr;</button>
                <button class="equal-button">=</button>
            </div>
        </div>
    </div>
</body>
</html>
